const statsKey = (sid) => `tai-stats-v1:${sid}`;

function todayMs() { return Date.now(); }
function addDays(ms, days) { return ms + days * 86400000; }

/* ---------------------------------------------------------------
   STORAGE HELPERS
--------------------------------------------------------------- */
async function loadJSON(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : fallback;
  } catch {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("storage save failed", e);
  }
}
async function loadText(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    return res ? res.value : fallback;
  } catch {
    return fallback;
  }
}
async function saveText(key, value) {
  try {
    await window.storage.set(key, value, false);
  } catch (e) {
    console.error("storage save failed", e);
  }
}

/* ---------------------------------------------------------------
   TILE CHIP — the signature visual element
--------------------------------------------------------------- */
function TileChip({ pattern, catColor, size = "md", onClick, dim }) {
  const color = catColor[pattern.cat] || "#4F7942";
  return (
    <button
      onClick={onClick}
      className={`tile-chip tile-${size}`}
      style={{ borderColor: color, opacity: dim ? 0.45 : 1, cursor: onClick ? "pointer" : "default" }}
    >
      <span className="tile-zh" style={{ color }}>{pattern.zh.slice(0, 2)}</span>
      <span className="tile-en">{pattern.en}</span>
      <span className="tile-tai" style={{ background: color }}>{pattern.tai}</span>
    </button>
  );
}

/* ---------------------------------------------------------------
   FLASHCARD VIEW
--------------------------------------------------------------- */
function FlashcardView({ system, progress, setProgress, stats, setStats }) {
  const PATTERNS = system.patterns;
  const CAT_COLOR = system.catColor;

  const due = useMemo(() => {
    const now = todayMs();
    return PATTERNS.filter((p) => {
      const rec = progress[p.id];
      return !rec || rec.due <= now;
    });
  }, [progress, PATTERNS]);

  const [queue, setQueue] = useState([]);
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);

  useEffect(() => {
    setQueue([...due].sort(() => Math.random() - 0.5));
    setIdx(0);
    setFlipped(false);
  }, [due.length]);

  const current = queue[idx];

  const grade = useCallback((quality) => {
    if (!current) return;
    const rec = progress[current.id] || { box: 1, due: todayMs() };
    let box = rec.box;
    if (quality === "again") box = 1;
    else if (quality === "good") box = Math.min(box + 1, 6);
    else if (quality === "easy") box = Math.min(box + 2, 6);
    const next = { box, due: addDays(todayMs(), BOX_INTERVAL_DAYS[box]) };
    const newProgress = { ...progress, [current.id]: next };
    setProgress(newProgress);
    saveJSON(progressKey(system.id), newProgress);
    const newStats = { ...stats, reviews: (stats.reviews || 0) + 1, correct: (stats.correct || 0) + (quality === "again" ? 0 : 1) };
    setStats(newStats);
    saveJSON(statsKey(system.id), newStats);
    setFlipped(false);
    setIdx((i) => i + 1);
  }, [current, progress, stats, setProgress, setStats, system.id]);

  if (!current) {
    return (
      <div className="empty-state">
        <div className="empty-tile">休</div>
        <p>Nothing due right now.</p>
        <p className="muted">{PATTERNS.length - due.length} of {PATTERNS.length} patterns are resting in review. Come back later, or switch to Quiz.</p>
      </div>
    );
  }

  return (
    <div className="flash-wrap">
      <div className="flash-progress">{idx + 1} / {queue.length} due</div>
      <div className={`flashcard ${flipped ? "is-flipped" : ""}`} onClick={() => setFlipped((f) => !f)}>
        <div className="flash-face flash-front">
          <span className="cat-label" style={{ color: CAT_COLOR[current.cat] }}>{current.cat}</span>
          <h2>{current.en}</h2>
          <p className="zh-large">{current.zh}</p>
          <p className="tap-hint">tap to reveal tai</p>
        </div>
        <div className="flash-face flash-back">
          <span className="tai-big" style={{ color: CAT_COLOR[current.cat] }}>
            {typeof current.tai === "number" ? `${current.tai} tai` : current.tai}
          </span>
          {current.note && <p className="note">{current.note}</p>}
        </div>
      </div>
      {flipped && (
        <div className="grade-row">
          <button className="grade-btn again" onClick={() => grade("again")}>Missed it</button>
          <button className="grade-btn good" onClick={() => grade("good")}>Got it</button>
          <button className="grade-btn easy" onClick={() => grade("easy")}>Easy</button>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   QUIZ VIEW — sum the tai for a mini "hand" of stacked patterns
--------------------------------------------------------------- */
function makeRound(PATTERNS) {
  const pool = PATTERNS.filter((p) => typeof p.tai === "number");
  const n = 2 + Math.floor(Math.random() * 2); // 2 or 3 patterns
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const picks = shuffled.slice(0, n);
  return { picks, total: picks.reduce((s, p) => s + p.tai, 0) };
}

function QuizView({ system, stats, setStats }) {
  const PATTERNS = system.patterns;
  const CAT_COLOR = system.catColor;

  const [round, setRound] = useState(() => makeRound(PATTERNS));
  const [guess, setGuess] = useState("");
  const [result, setResult] = useState(null); // null | 'right' | 'wrong'
  const [streak, setStreak] = useState(0);

  const submit = () => {
    const val = parseInt(guess, 10);
    if (Number.isNaN(val)) return;
    const right = val === round.total;
    setResult(right ? "right" : "wrong");
    setStreak((s) => (right ? s + 1 : 0));
    const newStats = { ...stats, quizAttempts: (stats.quizAttempts || 0) + 1, quizCorrect: (stats.quizCorrect || 0) + (right ? 1 : 0) };
    setStats(newStats);
    saveJSON(statsKey(system.id), newStats);
  };

  const next = () => {
    setRound(makeRound(PATTERNS));
    setGuess("");
    setResult(null);
  };

  return (
    <div className="quiz-wrap">
      <div className="quiz-meta">
        <span>Streak: {streak}</span>
        <span className="muted">{stats.quizCorrect || 0}/{stats.quizAttempts || 0} correct all-time</span>
      </div>
      <p className="quiz-instruction">This hand scores the tai below. What's the total?</p>
      <div className="tile-row">
        {round.picks.map((p) => <TileChip key={p.id + Math.random()} pattern={{ ...p, tai: result ? p.tai : "?" }} catColor={CAT_COLOR} />)}
      </div>
      {!result ? (
        <div className="answer-row">
          <input
            type="number"
            inputMode="numeric"
            value={guess}
            onChange={(e) => setGuess(e.target.value)}
            placeholder="total tai"
            className="tai-input"
            onKeyDown={(e) => e.key === "Enter" && submit()}
          />
          <button className="submit-btn" onClick={submit}>Check</button>
        </div>
      ) : (
        <div className="result-block">
          <p className={`result-headline ${result}`}>
            {result === "right" ? "Correct — " : "Not quite — "}total is {round.total} tai
          </p>
          <ul className="breakdown">
            {round.picks.map((p) => (
              <li key={p.id}><span>{p.en}</span><span>{p.tai} tai</span></li>
            ))}
          </ul>
          <button className="next-btn" onClick={next}>Next hand →</button>
        </div>
      )}
    </div>
  );
}

  const [filter, setFilter] = useState("All");
  const [openId, setOpenId] = useState(null);
  const list = filter === "All" ? PATTERNS : PATTERNS.filter((p) => p.cat === filter);
  return (
    <div className="ref-wrap">
      <div className="filter-row">
        <button className={`filter-chip ${filter === "All" ? "active" : ""}`} onClick={() => setFilter("All")}>All</button>
        {CATEGORIES.map((c) => (
          <button key={c} className={`filter-chip ${filter === c ? "active" : ""}`} style={filter === c ? { background: CAT_COLOR[c] } : {}} onClick={() => setFilter(c)}>{c}</button>
        ))}
      </div>
      <p className="ref-hint">Tap any pattern for a worked example.</p>
      <div className="ref-list">
        {list.map((p) => {
          const open = openId === p.id;
          return (
            <div className="ref-item" key={p.id}>
              <button className="ref-row" onClick={() => setOpenId(open ? null : p.id)} aria-expanded={open}>
                <div className="ref-tai" style={{ background: CAT_COLOR[p.cat] }}>{p.tai}</div>
                <div className="ref-text">
                  <div className="ref-en">{p.en} {p.zh && <span className="ref-zh">{p.zh}</span>}</div>
                  {p.note && <div className="ref-note">{p.note}</div>}
                </div>
                <div className={`ref-chevron ${open ? "open" : ""}`}>▾</div>
              </button>
              {open && (
                <div className="ref-example">
                  <div className="ref-example-tiles">
                    {p.ex.map((t, i) => (
                      <span key={i} className={/[\u{1F000}-\u{1F02B}]/u.test(t) ? "ex-tile" : "ex-glyph"}>{t}</span>
                    ))}
                  </div>
                  <p className="ref-example-cap">{p.exCap}</p>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <p className="source-note">
        {system.sourceLines.map((line, i) => (
          <React.Fragment key={i}>
            {line}
            {i < system.sourceLines.length - 1 && <br />}
          </React.Fragment>
        ))}
      </p>
    </div>
  );
}

          background: #C9A24B; color: #241F19; font-weight: 700; cursor: pointer;
        }
        .result-block { display: flex; flex-direction: column; gap: 12px; }
        .result-headline { font-weight: 700; font-size: 15px; }
        .result-headline.right { color: #7fbf6a; }
        .result-headline.wrong { color: #d98a6a; }
        .breakdown { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
        .breakdown li { display: flex; justify-content: space-between; font-size: 13px; background: rgba(241,234,215,0.08); padding: 8px 12px; border-radius: 6px; }

        /* Reference */
        .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .filter-chip {
          padding: 7px 12px; border-radius: 20px; border: 1px solid #3c5a4d;
          background: transparent; color: #E4DCC8; font-size: 12px; cursor: pointer;
        }
        .filter-chip.active { color: #16332B; border-color: transparent; font-weight: 700; }
        .ref-hint { font-size: 12px; color: #7b9186; margin: 0 0 10px; }
        .ref-list { display: flex; flex-direction: column; gap: 8px; }
        .ref-item { background: rgba(241,234,215,0.06); border-radius: 8px; overflow: hidden; }
        .ref-row {
          display: flex; gap: 12px; align-items: flex-start; width: 100%;
          background: none; border: none; padding: 10px 12px; text-align: left; cursor: pointer;
          font-family: 'Inter', sans-serif; color: inherit;
        }
        .ref-tai { min-width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 12px; flex-shrink: 0; padding: 0 4px; }
        .ref-text { flex: 1; }
        .ref-en { font-size: 14px; font-weight: 500; color: #C6D0C8; }
        .ref-zh { font-family: 'Noto Serif TC', serif; color: #C6D0C8; margin-left: 6px; font-size: 13px; }
        .ref-note { font-size: 12px; color: #C6D0C8; opacity: 0.75; margin-top: 2px; }
        .ref-chevron { color: #7b9186; font-size: 13px; margin-top: 2px; transition: transform 0.15s ease; flex-shrink: 0; }
        .ref-chevron.open { transform: rotate(180deg); }
        .ref-example { padding: 4px 14px 16px 14px; }
        .ref-example-tiles {
          display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
          background: #F1EAD7; border-radius: 8px; padding: 12px; margin-bottom: 10px;
        }
        .ex-tile {
          font-size: 26px; line-height: 1; color: #16332B;
          filter: drop-shadow(0 1px 0 rgba(0,0,0,0.15));
        }
        .ex-glyph { font-size: 13px; color: #6b6353; font-weight: 600; align-self: center; }
        .ref-example-cap { font-size: 12.5px; color: #cfd8ce; line-height: 1.5; margin: 0; }
        .source-note { font-size: 11px; color: #6f8378; margin-top: 20px; line-height: 1.6; }

        /* Tabs */
        .tab-bar {
          position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
          width: 100%; max-width: 480px;
          display: flex; background: #0d241d; border-top: 1px solid #234437;
        }
        .tab-btn {
          flex: 1; padding: 14px 0 max(14px, env(safe-area-inset-bottom)); background: none; border: none;
          color: #7b9186; font-size: 12px; font-weight: 600; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn.active { color: #C9A24B; }
        .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0; }
        .tab-btn.active .tab-dot { opacity: 1; }
      `}</style>

      <div className="header">
        <div className="header-tile">
          <span className="seal">台</span>
          <h1>Tai Trainer</h1>
        </div>
        <p className="sub">Taiwanese Mahjong scoring drills</p>
      </div>

      <div className="system-switch">
        {Object.values(SYSTEMS).map((s) => (
          <button
            key={s.id}
            className={`system-btn ${systemId === s.id ? "active" : ""}`}
            onClick={() => switchSystem(s.id)}
          >
            {s.label}
          </button>
        ))}
      </div>

      {loaded && tab === "flash" && (
        <div className="due-banner">{dueCount} of {system.patterns.length} patterns due for review</div>
      )}

      <div className="tab-content">
        {!loaded ? (
          <p className="muted" style={{ textAlign: "center", marginTop: 60 }}>Loading your progress…</p>
        ) : tab === "flash" ? (
          <FlashcardView key={systemId} system={system} progress={progress} setProgress={setProgress} stats={stats} setStats={setStats} />
        ) : tab === "quiz" ? (
          <QuizView key={systemId} system={system} stats={stats} setStats={setStats} />
        ) : (
          <ReferenceView key={systemId} system={system} />
        )}
      </div>

      <div className="tab-bar">
        <button className={`tab-btn ${tab === "reference" ? "active" : ""}`} onClick={() => setTab("reference")}>
          <span className="tab-dot" />Reference
        </button>
        <button className={`tab-btn ${tab === "flash" ? "active" : ""}`} onClick={() => setTab("flash")}>
          <span className="tab-dot" />Flashcards
        </button>
        <button className={`tab-btn ${tab === "quiz" ? "active" : ""}`} onClick={() => setTab("quiz")}>
          <span className="tab-dot" />Quiz
        </button>
      </div>
    </div>
  );
}

</script>

<script>
  window.storage = {
    get: async (key) => {
      let raw = null;
      try { raw = localStorage.getItem('tai-trainer:' + key); } catch (e) {}
      if (raw === null) throw new Error('not found');
      return { key, value: raw, shared: false };
    },
    set: async (key, value) => {
      try { localStorage.setItem('tai-trainer:' + key, value); } catch (e) {}
      return { key, value, shared: false };
    },
  };

  function showBootError(msg) {
    var e = document.getElementById('boot-error');
    e.style.display = 'block';
    e.textContent = 'Something failed to load:\n\n' + msg;
  }
  window.addEventListener('error', function (e) { showBootError(e.message); });

  try {
    var src = document.getElementById('app-source').textContent;
    var compiled = Babel.transform(src, {
      presets: [['react', { runtime: 'classic' }]],
    }).code;
    var run = new Function('React', 'ReactDOM', 'useState', 'useEffect', 'useMemo', 'useCallback',
      compiled + '\nreturn App;');
    var App = run(React, ReactDOM, React.useState, React.useEffect, React.useMemo, React.useCallback);
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  } catch (e) {
    showBootError(e.message);
  }
</script>
</body>
</html>
