<html lang="en">
<head>

<title>Tai Trainer — Taiwanese Mahjong Scoring (Offline)</title>

<style>
html, body { margin: 0; padding: 0; background: #123329; }
#root { min-height: 100vh; }


        * { box-sizing: border-box; }
        .app-root {
          min-height: 100vh;
          background:
            radial-gradient(circle at 20% -10%, rgba(255,255,255,0.05), transparent 40%),
            repeating-linear-gradient(135deg, #123329 0px, #123329 2px, #103026 2px, #103026 4px),
            #123329;
          font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
          color: #F1EAD7;
          padding: 0 0 90px 0;
          max-width: 480px;
          margin: 0 auto;
        }
        .header {
          padding: 28px 20px 16px;
          text-align: center;
        }
        .header-tile {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          background: #F1EAD7;
          color: #16332B;
          padding: 10px 22px;
          border-radius: 6px;
          box-shadow: 0 3px 0 rgba(0,0,0,0.25), 0 8px 20px rgba(0,0,0,0.35);
        }
        .header-tile .seal {
          background: #B23A2E;
          color: #F1EAD7;
          width: 26px; height: 26px;
          border-radius: 4px;
          display: flex; align-items: center; justify-content: center;
          font-family: Georgia, 'Songti TC', 'PingFang TC', serif;
          font-weight: 700;
          font-size: 15px;
        }
        .header-tile h1 {
          font-family: Georgia, 'Songti TC', 'PingFang TC', serif;
          font-weight: 900;
          font-size: 20px;
          margin: 0;
          letter-spacing: 0.02em;
        }
        .header p.sub {
          margin: 12px 0 0;
          font-size: 13px;
          color: #B7C4B9;
        }
        .system-switch {
          display: flex; gap: 6px; margin: 16px 20px 0;
          background: rgba(241,234,215,0.08); border-radius: 12px; padding: 4px;
        }
        .system-btn {
          flex: 1; padding: 10px 8px; border-radius: 9px; border: none;
          background: none; color: #B7C4B9; font-size: 12.5px; font-weight: 600;
          cursor: pointer; font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; line-height: 1.3;
        }
        .system-btn.active { background: #F1EAD7; color: #16332B; }
        .due-banner {
          margin: 14px 20px 0;
          text-align: center;
          font-size: 12px;
          color: #C9A24B;
          letter-spacing: 0.04em;
          text-transform: uppercase;
        }

        .tab-content { padding: 20px; }

        /* Flashcards */
        .flash-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .flash-progress { font-size: 12px; color: #B7C4B9; letter-spacing: 0.05em; text-transform: uppercase; }
        .flashcard {
          width: 100%;
          min-height: 260px;
          background: #F1EAD7;
          color: #241F19;
          border-radius: 14px;
          box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 14px 30px rgba(0,0,0,0.4);
          position: relative;
          cursor: pointer;
          display: flex;
        }
        .flash-face {
          width: 100%;
          padding: 28px 24px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        .flash-back { display: none; }
        .flashcard.is-flipped .flash-front { display: none; }
        .flashcard.is-flipped .flash-back { display: flex; }
        .cat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; }
        .flash-front h2 {
          font-family: Georgia, 'Songti TC', 'PingFang TC', serif;
          font-size: 24px;
          margin: 12px 0 4px;
          line-height: 1.25;
        }
        .zh-large { font-family: Georgia, 'Songti TC', 'PingFang TC', serif; font-size: 26px; color: #6b6353; margin: 6px 0 18px; }
        .tap-hint { font-size: 12px; color: #948a75; margin-top: auto; }
        .tai-big { font-family: Georgia, 'Songti TC', 'PingFang TC', serif; font-size: 36px; font-weight: 900; }
        .note { font-size: 13px; color: #5c5648; margin-top: 12px; max-width: 320px; }
        .grade-row { display: flex; gap: 10px; width: 100%; }
        .grade-btn {
          flex: 1; padding: 13px 8px; border-radius: 10px; border: none;
          font-weight: 600; font-size: 13px; cursor: pointer; color: #fff;
        }
        .grade-btn.again { background: #7a4038; }
        .grade-btn.good { background: #4F7942; }
        .grade-btn.easy { background: #C9A24B; color: #241F19; }

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-tile {
          font-family: Georgia, 'Songti TC', 'PingFang TC', serif; font-size: 30px; font-weight: 900;
          width: 60px; height: 60px; line-height: 60px; margin: 0 auto 16px;
          background: #F1EAD7; color: #16332B; border-radius: 8px;
        }
        .muted { color: #8fa093; font-size: 13px; }

        /* Quiz */
        .quiz-wrap { display: flex; flex-direction: column; gap: 16px; }
        .quiz-meta { display: flex; justify-content: space-between; font-size: 13px; color: #C9A24B; }
        .quiz-instruction { font-size: 15px; color: #E4DCC8; }
        .tile-row { display: flex; flex-direction: column; gap: 10px; }
        .tile-chip {
          display: flex; align-items: center; gap: 10px;
          background: #F1EAD7; border: 2px solid; border-radius: 8px;
          padding: 10px 12px; text-align: left; width: 100%;
          font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
        }
        .tile-zh { font-family: Georgia, 'Songti TC', 'PingFang TC', serif; font-weight: 700; font-size: 16px; }
        .tile-en { flex: 1; font-size: 13px; color: #241F19; font-weight: 500; }
        .tile-tai { color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 20px; }
        .answer-row { display: flex; gap: 10px; }
        .tai-input {
          flex: 1; padding: 14px; border-radius: 10px; border: none;
          font-size: 18px; background: #F1EAD7; color: #241F19; text-align: center;
        }
        .submit-btn, .next-btn {
          padding: 14px 20px; border-radius: 10px; border: none;
          background: #C9A24B; color: #241F19; font-weight: 700; cursor: pointer;
        }
        .result-block { display: flex; flex-direction: column; gap: 12px; }
        .result-headline { font-weight: 700; font-size: 15px; }
        .result-headline.right { color: #7fbf6a; }
        .result-headline.wrong { color: #d98a6a; }
        .breakdown { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
        .breakdown li { display: flex; justify-content: space-between; font-size: 13px; background: rgba(241,234,215,0.08); padding: 8px 12px; border-radius: 6px; }

        /* Reference */
        .filter-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .filter-chip {
          padding: 7px 12px; border-radius: 20px; border: 1px solid #3c5a4d;
          background: transparent; color: #E4DCC8; font-size: 12px; cursor: pointer;
        }
        .filter-chip.active { color: #16332B; border-color: transparent; font-weight: 700; }
        .ref-hint { font-size: 12px; color: #7b9186; margin: 0 0 10px; }
        .ref-list { display: flex; flex-direction: column; gap: 8px; }
        .ref-item { background: rgba(241,234,215,0.06); border-radius: 8px; overflow: hidden; }
        .ref-row {
          display: flex; gap: 12px; align-items: flex-start; width: 100%;
          background: none; border: none; padding: 10px 12px; text-align: left; cursor: pointer;
          font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; color: inherit;
        }
        .ref-tai { min-width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 12px; flex-shrink: 0; padding: 0 4px; }
        .ref-text { flex: 1; }
        .ref-en { font-size: 14px; font-weight: 500; color: #C6D0C8; }
        .ref-zh { font-family: Georgia, 'Songti TC', 'PingFang TC', serif; color: #C6D0C8; margin-left: 6px; font-size: 13px; }
        .ref-note { font-size: 12px; color: #C6D0C8; opacity: 0.75; margin-top: 2px; }
        .ref-chevron { color: #7b9186; font-size: 13px; margin-top: 2px; transition: transform 0.15s ease; flex-shrink: 0; }
        .ref-chevron.open { transform: rotate(180deg); }
        .ref-example { padding: 4px 14px 16px 14px; }
        .ref-example-tiles {
          display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
          background: #F1EAD7; border-radius: 8px; padding: 12px; margin-bottom: 10px;
        }
        .ex-tile {
          font-size: 26px; line-height: 1; color: #16332B;
          filter: drop-shadow(0 1px 0 rgba(0,0,0,0.15));
        }
        .ex-glyph { font-size: 13px; color: #6b6353; font-weight: 600; align-self: center; }
        .ref-example-cap { font-size: 12.5px; color: #cfd8ce; line-height: 1.5; margin: 0; }
        .source-note { font-size: 11px; color: #6f8378; margin-top: 20px; line-height: 1.6; }

        /* Tabs */
        .tab-bar {
          position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
          width: 100%; max-width: 480px;
          display: flex; background: #0d241d; border-top: 1px solid #234437;
        }
        .tab-btn {
          flex: 1; padding: 14px 0 max(14px, env(safe-area-inset-bottom)); background: none; border: none;
          color: #7b9186; font-size: 12px; font-weight: 600; cursor: pointer;
          display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn.active { color: #C9A24B; }
        .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0; }
        .tab-btn.active .tab-dot { opacity: 1; }
      
</style>
</head>
<body>
<!--
  Fully self-contained, offline-usable version of Tai Trainer.
  No CDN, no external fonts, no network calls of any kind —
  everything needed to run is in this one file. Uses system
  fonts (Georgia/Songti TC for the display face, the OS default
  sans for body text) and the browser's localStorage for saving
  your flashcard/quiz progress (tracked separately per scoring
  system), so it also works with Safari's "Add to Home Screen"
  as an offline-capable icon.
-->
<div id="root"></div>
<div id="boot-error" style="display:none; font-family:-apple-system,sans-serif; color:#F1EAD7; background:#3a1414; padding:20px; margin:16px; border-radius:10px; white-space:pre-wrap;"></div>
<script>
window.addEventListener('error', function (e) {
  var box = document.getElementById('boot-error');
  box.style.display = 'block';
  box.textContent = 'Something failed to load:\n\n' + e.message;
});
</script>

const BOX_INTERVAL_DAYS = [0, 0, 1, 3, 7, 16, 32];
const ACTIVE_SYSTEM_KEY = "tai-active-system-v1";
function progressKey(sid) { return "tai-progress-v1:" + sid; }
function statsKey(sid) { return "tai-stats-v1:" + sid; }

/* ---------- storage (localStorage, fully offline) ---------- */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem('tai-trainer:' + key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem('tai-trainer:' + key, JSON.stringify(value)); }
  catch (e) { console.error('storage save failed', e); }
}
function loadText(key, fallback) {
  try {
    const raw = localStorage.getItem('tai-trainer:' + key);
    return raw === null ? fallback : raw;
  } catch (e) { return fallback; }
}
function saveText(key, value) {
  try { localStorage.setItem('tai-trainer:' + key, value); }
  catch (e) { console.error('storage save failed', e); }
}
function todayMs() { return Date.now(); }
function addDays(ms, days) { return ms + days * 86400000; }
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.startsWith('on') && typeof attrs[k] === 'function') e.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach((c) => { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function isTileGlyph(t) { return /[\u{1F000}-\u{1F02B}]/u.test(t); }

/* ---------- app state ---------- */
const state = {
  systemId: 'generic',
  tab: 'reference',
  progress: {},
  stats: {},
  flashQueue: [],
  flashIdx: 0,
  flashFlipped: false,
  quizRound: null,
  quizStreak: 0,
  refFilter: 'All',
  refOpenId: null,
};

function currentSystem() { return SYSTEMS[state.systemId]; }

function loadForSystem(sid) {
  state.progress = loadJSON(progressKey(sid), {});
  state.stats = loadJSON(statsKey(sid), {});
}

function dueList() {
  const now = todayMs();
  const patterns = currentSystem().patterns;
  return patterns.filter((p) => {
    const rec = state.progress[p.id];
    return !rec || rec.due <= now;
  });
}

function buildFlashQueue() {
  state.flashQueue = [...dueList()].sort(() => Math.random() - 0.5);
  state.flashIdx = 0;
  state.flashFlipped = false;
}

function makeQuizRound() {
  const patterns = currentSystem().patterns;
  const pool = patterns.filter((p) => typeof p.tai === 'number');
  const n = 2 + Math.floor(Math.random() * 2);
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const picks = shuffled.slice(0, n);
  return { picks, total: picks.reduce((s, p) => s + p.tai, 0) };
}

/* ---------- root render ---------- */
const root = document.getElementById('root');

function render() {
  root.innerHTML = '';
  root.appendChild(buildHeader());
  root.appendChild(buildSystemSwitch());
  if (state.tab === 'flash') root.appendChild(buildFlashView());
  else if (state.tab === 'quiz') root.appendChild(buildQuizView());
  else root.appendChild(buildRefView());
  root.appendChild(buildTabBar());
}

function buildHeader() {
  const wrap = el('div', { class: 'header' }, [
    el('div', { class: 'header-tile' }, [
      el('span', { class: 'seal', text: '台' }),
      el('h1', { text: 'Tai Trainer' }),
    ]),
    el('p', { class: 'sub', text: 'Taiwanese Mahjong scoring drills' }),
  ]);
  if (state.tab === 'flash') {
    const due = dueList().length;
    wrap.appendChild(el('div', { class: 'due-banner', text: due + ' of ' + currentSystem().patterns.length + ' patterns due for review' }));
  }
  return wrap;
}

function buildSystemSwitch() {
  const wrap = el('div', { class: 'system-switch' });
  Object.values(SYSTEMS).forEach((s) => {
    const btn = el('button', {
      class: 'system-btn' + (state.systemId === s.id ? ' active' : ''),
      text: s.label,
      onClick: () => {
        if (state.systemId === s.id) return;
        state.systemId = s.id;
        saveText(ACTIVE_SYSTEM_KEY, s.id);
        loadForSystem(s.id);
        state.flashQueue = []; state.flashIdx = 0; state.flashFlipped = false;
        state.quizRound = null; state.quizStreak = 0;
        state.refFilter = 'All'; state.refOpenId = null;
        render();
      },
    });
    wrap.appendChild(btn);
  });
  return wrap;
}

function buildTabBar() {
  const mk = (id, label) => el('button', {
    class: 'tab-btn' + (state.tab === id ? ' active' : ''),
    onClick: () => { state.tab = id; if (id === 'flash') buildFlashQueue(); render(); },
  }, [el('span', { class: 'tab-dot' }), document.createTextNode(label)]);
  return el('div', { class: 'tab-bar' }, [
    mk('reference', 'Reference'), mk('flash', 'Flashcards'), mk('quiz', 'Quiz'),
  ]);
}

/* ---------- flashcards ---------- */
function buildFlashView() {
  const CAT_COLOR = currentSystem().catColor;
  if (!state.flashQueue.length && state.flashIdx === 0) buildFlashQueue();
  const content = el('div', { class: 'tab-content' });
  const current = state.flashQueue[state.flashIdx];
  if (!current) {
    content.appendChild(el('div', { class: 'empty-state' }, [
      el('div', { class: 'empty-tile', text: '休' }),
      el('p', { text: 'Nothing due right now.' }),
      el('p', { class: 'muted', text: (currentSystem().patterns.length - dueList().length) + ' of ' + currentSystem().patterns.length + ' patterns are resting in review. Come back later, or switch to Quiz.' }),
    ]));
    return content;
  }
  const wrap = el('div', { class: 'flash-wrap' });
  wrap.appendChild(el('div', { class: 'flash-progress', text: (state.flashIdx + 1) + ' / ' + state.flashQueue.length + ' due' }));

  const card = el('div', { class: 'flashcard' + (state.flashFlipped ? ' is-flipped' : ''), onClick: () => { state.flashFlipped = !state.flashFlipped; render(); } });
  const front = el('div', { class: 'flash-face flash-front' }, [
    el('span', { class: 'cat-label', text: current.cat, style: 'color:' + CAT_COLOR[current.cat] }),
    el('h2', { text: current.en }),
    el('p', { class: 'zh-large', text: current.zh }),
    el('p', { class: 'tap-hint', text: 'tap to reveal tai' }),
  ]);
  front.querySelector('.cat-label').style.color = CAT_COLOR[current.cat];
  const taiText = typeof current.tai === 'number' ? (current.tai + ' tai') : String(current.tai);
  const back = el('div', { class: 'flash-face flash-back' }, [
    el('span', { class: 'tai-big', text: taiText, style: 'color:' + CAT_COLOR[current.cat] }),
    current.note ? el('p', { class: 'note', text: current.note }) : null,
  ]);
  back.querySelector('.tai-big').style.color = CAT_COLOR[current.cat];
  card.appendChild(front);
  card.appendChild(back);
  wrap.appendChild(card);

  if (state.flashFlipped) {
    const grade = (quality) => {
      const rec = state.progress[current.id] || { box: 1, due: todayMs() };
      let box = rec.box;
      if (quality === 'again') box = 1;
      else if (quality === 'good') box = Math.min(box + 1, 6);
      else if (quality === 'easy') box = Math.min(box + 2, 6);
      state.progress[current.id] = { box, due: addDays(todayMs(), BOX_INTERVAL_DAYS[box]) };
      saveJSON(progressKey(state.systemId), state.progress);
      state.stats.reviews = (state.stats.reviews || 0) + 1;
      state.stats.correct = (state.stats.correct || 0) + (quality === 'again' ? 0 : 1);
      saveJSON(statsKey(state.systemId), state.stats);
      state.flashFlipped = false;
      state.flashIdx += 1;
      render();
    };
    wrap.appendChild(el('div', { class: 'grade-row' }, [
      el('button', { class: 'grade-btn again', text: 'Missed it', onClick: () => grade('again') }),
      el('button', { class: 'grade-btn good', text: 'Got it', onClick: () => grade('good') }),
      el('button', { class: 'grade-btn easy', text: 'Easy', onClick: () => grade('easy') }),
    ]));
  }
  content.appendChild(wrap);
  return content;
}

/* ---------- quiz ---------- */
function buildQuizView() {
  const CAT_COLOR = currentSystem().catColor;
  if (!state.quizRound) state.quizRound = makeQuizRound();
  const round = state.quizRound;
  const content = el('div', { class: 'tab-content' });
  const wrap = el('div', { class: 'quiz-wrap' });
  wrap.appendChild(el('div', { class: 'quiz-meta' }, [
    el('span', { text: 'Streak: ' + state.quizStreak }),
    el('span', { class: 'muted', text: (state.stats.quizCorrect || 0) + '/' + (state.stats.quizAttempts || 0) + ' correct all-time' }),
  ]));
  wrap.appendChild(el('p', { class: 'quiz-instruction', text: "This hand scores the tai below. What's the total?" }));

  const revealed = round.result !== undefined;
  const tileRow = el('div', { class: 'tile-row' });
  round.picks.forEach((p) => {
    const chip = el('button', { class: 'tile-chip' });
    chip.style.borderColor = CAT_COLOR[p.cat];
    chip.appendChild(el('span', { class: 'tile-zh', text: p.zh.slice(0, 2), style: 'color:' + CAT_COLOR[p.cat] }));
    chip.appendChild(el('span', { class: 'tile-en', text: p.en }));
    const taiTag = el('span', { class: 'tile-tai', text: revealed ? String(p.tai) : '?' });
    taiTag.style.background = CAT_COLOR[p.cat];
    chip.appendChild(taiTag);
    tileRow.appendChild(chip);
  });
  wrap.appendChild(tileRow);

  if (!revealed) {
    const input = el('input', { type: 'number', inputmode: 'numeric', placeholder: 'total tai', class: 'tai-input' });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
    const submit = () => {
      const val = parseInt(input.value, 10);
      if (Number.isNaN(val)) return;
      const right = val === round.total;
      round.result = right ? 'right' : 'wrong';
      state.quizStreak = right ? state.quizStreak + 1 : 0;
      state.stats.quizAttempts = (state.stats.quizAttempts || 0) + 1;
      state.stats.quizCorrect = (state.stats.quizCorrect || 0) + (right ? 1 : 0);
      saveJSON(statsKey(state.systemId), state.stats);
      render();
    };
    wrap.appendChild(el('div', { class: 'answer-row' }, [
      input,
      el('button', { class: 'submit-btn', text: 'Check', onClick: submit }),
    ]));
  } else {
    const headline = el('p', { class: 'result-headline ' + round.result, text: (round.result === 'right' ? 'Correct — ' : 'Not quite — ') + 'total is ' + round.total + ' tai' });
    const list = el('ul', { class: 'breakdown' });
    round.picks.forEach((p) => {
      list.appendChild(el('li', {}, [el('span', { text: p.en }), el('span', { text: p.tai + ' tai' })]));
    });
    wrap.appendChild(el('div', { class: 'result-block' }, [
      headline, list,
      el('button', { class: 'next-btn', text: 'Next hand →', onClick: () => { state.quizRound = makeQuizRound(); render(); } }),
    ]));
  }
  content.appendChild(wrap);
  return content;
}

/* ---------- reference ---------- */
function buildRefView() {
  const system = currentSystem();
  const CAT_COLOR = system.catColor;
  const content = el('div', { class: 'tab-content' });
  const wrap = el('div', { class: 'ref-wrap' });

  const filterRow = el('div', { class: 'filter-row' });
  const mkChip = (label) => {
    const active = state.refFilter === label;
    const chip = el('button', { class: 'filter-chip' + (active ? ' active' : ''), text: label, onClick: () => { state.refFilter = label; render(); } });
    if (active && label !== 'All') chip.style.background = CAT_COLOR[label];
    return chip;
  };
  filterRow.appendChild(mkChip('All'));
  system.categories.forEach((c) => filterRow.appendChild(mkChip(c)));
  wrap.appendChild(filterRow);
  wrap.appendChild(el('p', { class: 'ref-hint', text: 'Tap any pattern for a worked example.' }));

  const list = state.refFilter === 'All' ? system.patterns : system.patterns.filter((p) => p.cat === state.refFilter);
  const listEl = el('div', { class: 'ref-list' });
  list.forEach((p) => {
    const open = state.refOpenId === p.id;
    const item = el('div', { class: 'ref-item' });
    const row = el('button', { class: 'ref-row', onClick: () => { state.refOpenId = open ? null : p.id; render(); } });
    const taiTag = el('div', { class: 'ref-tai', text: String(p.tai) });
    taiTag.style.background = CAT_COLOR[p.cat];
    const enLine = el('div', { class: 'ref-en' }, [document.createTextNode(p.en + ' ')]);
    if (p.zh) enLine.appendChild(el('span', { class: 'ref-zh', text: p.zh }));
    const text = el('div', { class: 'ref-text' }, [
      enLine,
      p.note ? el('div', { class: 'ref-note', text: p.note }) : null,
    ]);
    row.appendChild(taiTag);
    row.appendChild(text);
    row.appendChild(el('div', { class: 'ref-chevron' + (open ? ' open' : ''), text: '▾' }));
    item.appendChild(row);
    if (open) {
      const tiles = el('div', { class: 'ref-example-tiles' });
      p.ex.forEach((t) => tiles.appendChild(el('span', { class: isTileGlyph(t) ? 'ex-tile' : 'ex-glyph', text: t })));
      item.appendChild(el('div', { class: 'ref-example' }, [tiles, el('p', { class: 'ref-example-cap', text: p.exCap })]));
    }
    listEl.appendChild(item);
  });
  wrap.appendChild(listEl);

  const sourceP = el('p', { class: 'source-note' });
  system.sourceLines.forEach((line, i) => {
    sourceP.appendChild(document.createTextNode(line));
    if (i < system.sourceLines.length - 1) sourceP.appendChild(el('br'));
  });
  wrap.appendChild(sourceP);
  content.appendChild(wrap);
  return content;
}

/* ---------- boot ---------- */
(function boot() {
  const saved = loadText(ACTIVE_SYSTEM_KEY, null);
  if (saved && SYSTEMS[saved]) state.systemId = saved;
  loadForSystem(state.systemId);
  buildFlashQueue();
  render();
})();

</script>
</body>
</html>
